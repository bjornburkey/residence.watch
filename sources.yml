# Quellen für den Wohnungs-Watcher.
#
# WICHTIG: Jede URL vor dem ersten Scharfschalten einmal im Browser öffnen und
# prüfen, ob sie noch existiert. Websites bauen ihre Struktur regelmäßig um.
#
# Felder je Quelle:
#   name      Anzeigename in der Benachrichtigung (Pflicht)
#   url       zu überwachende Seite (Pflicht)
#   selector  optionaler CSS-Selektor, um nur einen Seitenbereich zu prüfen
#             (reduziert Fehlalarme durch News-Teaser, Cookie-Banner etc.)
#   keywords  optionale Filterliste; ohne Angabe gilt die globale Liste unten,
#             mit "keywords: []" wird gar nicht gefiltert (alles melden)

# Globale Filter: nur Zeilen melden, die eines dieser Wörter enthalten.
# Leer lassen ([]), wenn jede Änderung gemeldet werden soll.
keywords:
  - Marienburg
  - Raderthal
  - Raderberg
  - Rodenkirchen
  - Bayenthal
  - Sürth
  - Auenviertel
  - freie Wohnung
  - Wohnungsangebot
  - zu vermieten
  - Vermietung
  - Zimmer

